[project]
name = "fincore"
version = "0.1.0"
description = "FinCore Account Record Change domain module"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6,<1",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1,<2",
    "pydantic>=2.8,<3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4,<5",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
